# Cargo configuration for ONNX Runtime linking
# This ensures proper C++ standard library linking on all platforms
# Handles GCC 9.x compatibility with modern ONNX Runtime binaries

[build]
# When -nodefaultlibs is used, we must provide all system libraries
# IMPORTANT: Linking order matters! C++ libraries must be linked BEFORE C library
# and WITH --no-as-needed to prevent symbol stripping
# 
# GCC 9 Compatibility:
# ONNX Runtime is built with GCC 11+ (modern C++ ABI) but may run on GCC 9.
# We use --allow-shlib-undefined to let the dynamic linker resolve symbols at runtime.
# This approach works with both GNU ld (BFD) and LLVM's lld linker.
rustflags = [
    # Allow undefined symbols to be resolved at runtime by dynamic linker
    # This is critical for GCC 9 compatibility with GCC 11+ ONNX Runtime binaries
    # Works with both GNU ld and LLVM lld
    "-C", "link-arg=-Wl,--allow-shlib-undefined",
    "-C", "link-arg=-Wl,--no-as-needed",
    "-C", "link-arg=-lstdc++",      # C++ standard library MUST come first
    "-C", "link-arg=-lgcc_s",       # GCC support library (includes newer ABI shims)
    "-C", "link-arg=-lm",           # Math library
    "-C", "link-arg=-ldl",          # Dynamic linker
    "-C", "link-arg=-lpthread",     # POSIX threads
    "-C", "link-arg=-lc",           # C library comes LAST
    # Re-enable as-needed after critical libraries
    "-C", "link-arg=-Wl,--as-needed",
    # Ensure runtime linker finds correct libstdc++ with new ABI symbols
    "-C", "link-arg=-Wl,-rpath=/usr/lib/x86_64-linux-gnu",
    "-C", "link-arg=-Wl,-rpath=/usr/lib64",
    "-C", "link-arg=-Wl,-rpath=/lib/x86_64-linux-gnu",
    "-C", "link-arg=-Wl,-rpath=/lib64",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = false  # Keep symbols for debugging


