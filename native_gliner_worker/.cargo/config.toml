# Cargo configuration for ONNX Runtime linking
# This ensures proper C++ standard library linking on all platforms

[build]
# Explicitly link C++ standard library for ONNX Runtime compatibility
# Uses rustc-link-lib which gets translated to proper -l flags
rustflags = [
    "-C", "link-arg=-lstdc++",
    "-C", "link-arg=-lm",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = false  # Keep symbols for debugging


